<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GAINZ"/>
<title>GAINZ</title>
<link rel="apple-touch-icon" href="icon-gainz.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css?v=2"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
</head>
<body>
<div id="ambient-particles"></div>
<div id="cinematic-splash" style="display:flex;" onclick="dismissCinematic()">
  <div class="cin-container" id="cin-container"></div>
  <div class="cin-skip" onclick="event.stopPropagation();skipCinematic()">SKIP</div>
</div>
<div id="onboard-splash" style="display:none;" onclick="dismissSplash()">
  <div class="ob-logo">GAINZ</div>
  <div class="ob-tagline">Track. Progress. Dominate.</div>
  <div class="ob-cards-wrap" id="ob-cards-wrap" onclick="event.stopPropagation()">
    <div class="ob-cards-track" id="ob-cards-track"></div>
  </div>
  <div class="ob-dots" id="ob-dots"></div>
  <div style="font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:10px;opacity:0;animation:obSlideIn 0.8s ease 4.2s forwards;">SWIPE OR TAP TO SKIP</div>
  <button class="ob-skip" onclick="dismissSplash()">SKIP →</button>
</div>
<div id="app">
  <div class="header">
    <button class="back-btn" id="back-btn" onclick="goBack()">‹ BACK</button>
    <div class="logo" id="logo-tap">GAINZ</div>
    <div class="header-right">
      <div class="wo-timer" id="wo-timer" onclick="editWorkoutTime()" style="cursor:pointer;"></div>
      <div class="streak" id="streak-el">🔥 0</div>
    </div>
  </div>
  <div class="timer-bar" id="timer-bar">
    <div class="timer-left" onclick="scrollToTimerEx()" style="cursor:pointer;">
      <div class="timer-label" id="timer-label">REST</div>
      <div id="timer-display"><div class="timer-num" id="timer-num">0:45</div></div>
    </div>
    <div class="timer-adj">
      <button class="t-adj" onclick="adjTimer(-15)">−15</button>
      <button class="t-adj" onclick="adjTimer(15)">+15</button>
    </div>
    <div class="timer-actions">
      <button class="t-addex" onclick="openPicker()">+EX</button>
      <button class="t-skip" onclick="skipTimer()">SKIP</button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div id="sticky-finish" style="display:none;position:fixed;bottom:calc(60px + env(safe-area-inset-bottom));left:0;right:0;padding:0 18px 8px;pointer-events:none;z-index:99;">
    <div style="pointer-events:all;display:flex;gap:8px;">
      <button onclick="undoLastSet()" id="sticky-undo" style="background:#111215;border:1px solid #1e1e24;border-radius:12px;padding:13px 16px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.5px;cursor:pointer;flex-shrink:0;">↩ UNDO</button>
      <button onclick="confirmFinish()" style="flex:1;background:var(--accent);color:#080808;border:none;border-radius:12px;padding:13px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;cursor:pointer;box-shadow:0 0 20px rgba(232,213,160,0.2);">FINISH ✓</button>
    </div>
  </div>
  <div class="nav" id="nav"></div>
</div>

<!-- EXERCISE PICKER — persistent modal, never rebuilt -->
<div id="ex-picker">
  <div id="ex-picker-sheet">
    <div id="ex-picker-header">
      <span id="ex-picker-title">ADD EXERCISE</span>
      <button id="ex-picker-close" onclick="closePicker()">CLOSE</button>
    </div>
    <div class="picker-filter">
      <button class="picker-filter-btn active" id="filter-all" onclick="setPickerFilter('all')">ALL</button>
      <button class="picker-filter-btn" id="filter-research" onclick="setPickerFilter('research')">📚 RESEARCHED</button>
      <button class="picker-filter-btn" id="filter-stacks" onclick="setPickerFilter('stacks')">⚡ STACKS</button>
      <button class="picker-filter-btn" id="filter-browse" onclick="closePicker();openLibrary()">BROWSE</button>
    </div>
    <div id="ex-picker-list"></div>
    <div id="ex-picker-custom">
      <input class="input" id="custom-ex-input" placeholder="custom exercise..." style="font-size:14px;flex:1;"/>
      <button class="btn primary small" onclick="addCustomExercise()">ADD</button>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->
<div id="import-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;overflow-y:auto;">
  <div style="max-width:520px;margin:0 auto;padding:24px 16px 80px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;">Import Log</div>
        <div style="font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">Paste · Parse · Confirm</div>
      </div>
      <button onclick="closeImportModal()" style="background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:4px 8px;">✕</button>
    </div>
    <div id="import-body"></div>
  </div>
</div>

<!-- RESEARCH LIBRARY MODAL -->
<div id="res-library">
  <div id="res-library-sheet">
    <div id="res-library-header">
      <span style="font-size:11px;letter-spacing:2px;color:var(--superset);">📚 RESEARCH LIBRARY</span>
      <button onclick="closeLibrary()" style="background:none;border:1px solid var(--dim);border-radius:6px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">CLOSE</button>
    </div>
    <div id="res-library-list"></div>
  </div>
</div>

<!-- GENERAL MODAL -->
<div id="modal">
  <div id="modal-inner"></div>
</div>

<!-- DEBUG PANEL -->
<div id="debug-panel">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:15px;color:var(--accent);letter-spacing:3px;">DEBUG</div>
    <button onclick="closeDebug()" style="background:none;border:1px solid var(--dim);border-radius:6px;padding:6px 14px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;">CLOSE</button>
  </div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;">
    <div style="color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between;">
      <span>UNIT TESTS</span>
      <span id="dbg-test-summary"></span>
    </div>
    <div id="dbg-test-list" style="max-height:220px;overflow-y:auto;"></div>
  </div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;">
    <div style="color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:10px;">APP STATE</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;">
      <span style="color:var(--dim)">VERSION</span><span id="dbg-version" style="color:var(--accent)"></span>
      <span style="color:var(--dim)">SCREEN</span><span id="dbg-screen"></span>
      <span style="color:var(--dim)">SPLIT</span><span id="dbg-split"></span>
      <span style="color:var(--dim)">EXERCISES</span><span id="dbg-exercises" style="color:var(--muted);font-size:11px;word-break:break-word;"></span>
      <span style="color:var(--dim)">WORKOUTS</span><span id="dbg-workouts"></span>
      <span style="color:var(--dim)">STORAGE</span><span id="dbg-storage"></span>
    </div>
  </div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;">
    <div style="color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:8px;">EVENT LOG</div>
    <div id="debug-log" style="color:var(--muted);font-size:11px;max-height:150px;overflow-y:auto;"></div>
  </div>
  <div style="color:var(--dim);font-size:10px;text-align:center;letter-spacing:1px;">TAP GAINZ 5× TO TOGGLE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "39dc7518-10c4-4790-a969-d158f697af3c",
      notifyButton: { enable: false },
    });
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
