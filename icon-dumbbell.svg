<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#080808"/>
  <!-- Dumbbell -->
  <g transform="translate(256,256) rotate(-30)">
    <!-- Bar -->
    <rect x="-120" y="-6" width="240" height="12" rx="6" fill="#e8d5a0"/>
    <!-- Left plates -->
    <rect x="-150" y="-40" width="28" height="80" rx="6" fill="#e8d5a0"/>
    <rect x="-170" y="-32" width="18" height="64" rx="5" fill="#e8d5a0" opacity="0.7"/>
    <!-- Right plates -->
    <rect x="122" y="-40" width="28" height="80" rx="6" fill="#e8d5a0"/>
    <rect x="152" y="-32" width="18" height="64" rx="5" fill="#e8d5a0" opacity="0.7"/>
    <!-- Collars -->
    <rect x="-122" y="-14" width="8" height="28" rx="3" fill="#c8b070"/>
    <rect x="114" y="-14" width="8" height="28" rx="3" fill="#c8b070"/>
  </g>
  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#e8d5a0" stroke-width="1" opacity="0.08"/>
